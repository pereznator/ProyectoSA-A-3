apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sa-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: jpanaza/auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: CORS_ORIGIN
              value: "http://localhost"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:3002"
            - name: DB_HOST
              value: "db-userauth"
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              value: "1234"
            - name: DB_DATABASE
              value: "auth_db"
            - name: JWT_SECRET
              value: "SA_PF1_20211147"
            - name: JWT_EXPIRATION
              value: "30m"
            - name: GCLOUD_PROJECT_ID
              value: "software-avanzado-2025-1s"
            - name: FRONTEND_URL
              value: "http://localhost"
            - name: MAILTRAP_USER
              value: "cbc30150d3e687"
            - name: MAILTRAP_PASSWORD
              value: "ee2f9c814435a6"
          resources:                # ✅ Control de CPU/Memoria agregado
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sa-app
spec:
  selector:
    app: auth-service
  type: ClusterIP
  ports:
    - port: 3001
      targetPort: 3001
