<div style="width: 100%;" class="p-4">
  <div class="row">
      <div class="col-md-10">
          <h3 class="fs-4">{{ title ?? "Confirmar accion" }}</h3>
      </div>
  </div>
  <hr>
  <div class="row">
      <p>{{ description }}</p>
  </div>
  <textarea type="text" class="form-control" [placeholder]="placeholder" [(ngModel)]="input"> </textarea>
  
  <div class="d-flex justify-content-end mt-3">
      <button class="btn btn-secondary mx-2" (click)="modal.dismiss()">Cancelar</button>
      <button id="confirm" class="btn btn-primary" [disabled]="input.length === 0" (click)="modal.close(input)">Confirmar</button>
  </div>

</div>
