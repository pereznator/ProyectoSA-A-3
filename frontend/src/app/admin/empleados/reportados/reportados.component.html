<div class="container">
  <div class="row mt-5">
    <div class="col-lg-10">
      <h1>Usuarios Reportados</h1>
    </div>
    <!-- <div class="col-lg">
      <div class="d-grid gap-2">
        <button class="btn btn-secondary btn-sm" (click)="verReportados()">Ver Reportes</button>
      </div>
    </div> -->
    <div class="col-lg">
      <div class="d-grid gap-2">
        <button class="btn btn-secondary btn-sm" (click)="location.back()">Regresar</button>
      </div>
    </div>
  </div>
  <hr>

  <app-loading *ngIf="loading"></app-loading>

  <table class="table mt-3" *ngIf="!loading">
    <thead class="table-dark">
      <tr>
        <th>Reportado</th>
        <th>Reportado Por</th>
        <th>Motivo</th>
        <th>Fecha</th>
        <th>Status</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios">
        <td>
          <a [routerLink]="['/admin', 'usuarios', usuario.reported_user.id]">
            {{usuario.reported_user.name}}
          </a>
        </td>
        <td>
          <a [routerLink]="['/admin', 'usuarios', usuario.reporter_user.id]">
            {{usuario.reporter_user.name}}
          </a>
        </td>
        <td>
          {{usuario.reason}}
        </td>
        <td>
          {{usuario.created_at | date: 'yyyy-MM-dd'}}
        </td>
        <td>
          <span class="badge" [ngClass]="{'text-bg-success': usuario.status === 'resolved', 'text-bg-warning': usuario.status === 'pending', 'text-bg-primary': usuario.status === 'reviewed', 'text-bg-danger': usuario.status === 'dismissed'}">
            {{usuario.status | uppercase}}
          </span>
        </td>
        <td>
          <button class="btn btn-secondary mx-3" ngbTooltip="Actualizar Estado" (click)="actualizarReportado(usuario)"><i class="bi bi-pencil-square"></i></button>
          <!-- <button class="btn btn-warning" ngbTooltip="Reportar Usuario"><i class="bi bi-exclamation-circle"></i></button> -->
        </td>
      </tr>
    </tbody>
  </table>
</div>
